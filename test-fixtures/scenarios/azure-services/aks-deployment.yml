# Pipeline para Azure Kubernetes Service
# Escenario: Containerized deployment con Helm

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: production-variables
  - name: acrName
    value: 'acr$(Build.Repository.Name)prod'
  - name: aksCluster
    value: 'aks-$(Build.Repository.Name)-prod'
  - name: imageRepository
    value: 'app'
  - name: tag
    value: '$(Build.BuildId)'

stages:
- stage: Validate
  jobs:
  - job: ValidateJob
    steps:
    - script: |
        helm lint ./charts/app
        kubectl apply --dry-run=client -f ./k8s/
      displayName: 'Validate K8s manifests'

- stage: Security
  dependsOn: Validate
  jobs:
  - job: SecurityScan
    steps:
    - task: TruffleHog@1
      inputs:
        failOnSecrets: true

    - task: SonarQubeAnalyze@5

    - task: SnykSecurityScan@1
      inputs:
        failOnIssues: true

    # Container image scanning
    - task: trivy@1
      displayName: 'Scan Dockerfile'
      inputs:
        image: '.'
        severity: 'HIGH,CRITICAL'
        exitCode: '1'

- stage: Build
  dependsOn: Security
  jobs:
  - job: BuildImage
    steps:
    - task: Docker@2
      displayName: 'Build image'
      inputs:
        containerRegistry: '$(acrName)'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: 'Dockerfile'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: 'Push image'
      inputs:
        containerRegistry: '$(acrName)'
        repository: '$(imageRepository)'
        command: 'push'
        tags: |
          $(tag)
          latest

- stage: Deploy
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployAKS
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: 'Create imagePullSecret'
            inputs:
              action: 'createSecret'
              kubernetesServiceConnection: 'AKSConnection'
              secretType: 'dockerRegistry'
              secretName: 'acr-secret'
              dockerRegistryEndpoint: '$(acrName)'

          - task: HelmDeploy@0
            displayName: 'Helm upgrade'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: 'AKSConnection'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: './charts/app'
              releaseName: 'app'
              overrideValues: 'image.repository=$(acrName).azurecr.io/$(imageRepository),image.tag=$(tag)'
              waitForExecution: true

          - task: Kubernetes@1
            displayName: 'Health check'
            inputs:
              kubernetesServiceConnection: 'AKSConnection'
              command: 'get'
              arguments: 'pods -l app=app'

# EXPECTED: Score > 85%
