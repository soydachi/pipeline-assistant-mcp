# Pipeline correcto para .NET Web API
# Escenario: Configuración óptima de referencia

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: production-variables
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '8.x'
  - name: NUGET_PACKAGES
    value: $(Pipeline.Workspace)/.nuget/packages

stages:
- stage: Validate
  displayName: 'Validation'
  jobs:
  - job: ValidateJob
    steps:
    - task: UseDotNet@2
      inputs:
        version: $(dotnetVersion)

    - task: Cache@2
      displayName: 'Cache NuGet'
      inputs:
        key: 'nuget | "$(Agent.OS)" | **/packages.lock.json'
        restoreKeys: |
          nuget | "$(Agent.OS)"
        path: $(NUGET_PACKAGES)

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'

    - task: DotNetCoreCLI@2
      displayName: 'Format check'
      inputs:
        command: 'custom'
        custom: 'format'
        arguments: '--verify-no-changes'

- stage: Security
  displayName: 'Security'
  dependsOn: Validate
  jobs:
  - job: SecurityScan
    steps:
    - task: TruffleHog@1
      displayName: 'Secret scanning'
      inputs:
        failOnSecrets: true

    - task: SonarQubePrepare@5
      displayName: 'SonarQube prepare'
      inputs:
        SonarQube: 'SonarQubeConnection'
        scannerMode: 'MSBuild'

    - task: DotNetCoreCLI@2
      displayName: 'Build for analysis'
      inputs:
        command: 'build'

    - task: SonarQubeAnalyze@5
      displayName: 'SonarQube analyze'

    - task: SnykSecurityScan@1
      displayName: 'Snyk scan'
      inputs:
        failOnIssues: true

    - task: DotNetCoreCLI@2
      displayName: 'Vulnerability check'
      inputs:
        command: 'custom'
        custom: 'list'
        arguments: 'package --vulnerable --include-transitive'

- stage: Build
  displayName: 'Build'
  dependsOn: Security
  jobs:
  - job: BuildJob
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'

- stage: Test
  displayName: 'Test'
  dependsOn: Build
  jobs:
  - job: UnitTests
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

# EXPECTED: Score > 90%, no violations
