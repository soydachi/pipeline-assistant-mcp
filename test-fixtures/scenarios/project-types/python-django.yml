# Pipeline correcto para Python Django
# Escenario: Configuración óptima de referencia

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: production-variables
  - name: pythonVersion
    value: '3.11'
  - name: PIP_CACHE_DIR
    value: $(Pipeline.Workspace)/.pip

stages:
- stage: Validate
  displayName: 'Validation'
  jobs:
  - job: ValidateJob
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - task: Cache@2
      displayName: 'Cache pip'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        restoreKeys: |
          pip | "$(Agent.OS)"
        path: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
      displayName: 'Install dependencies'

    - script: |
        pip install flake8 black isort mypy
        flake8 .
        black --check .
        isort --check-only .
        mypy .
      displayName: 'Lint and type check'

- stage: Security
  displayName: 'Security'
  dependsOn: Validate
  jobs:
  - job: SecurityScan
    steps:
    - task: TruffleHog@1
      displayName: 'Secret scanning'
      inputs:
        failOnSecrets: true

    - task: SonarQubePrepare@5
      displayName: 'SonarQube prepare'
      inputs:
        SonarQube: 'SonarQubeConnection'
        scannerMode: 'CLI'

    - task: SonarQubeAnalyze@5
      displayName: 'SonarQube analyze'

    - task: SnykSecurityScan@1
      displayName: 'Snyk scan'
      inputs:
        failOnIssues: true

    - script: |
        pip install safety bandit
        safety check -r requirements.txt
        bandit -r . -x ./tests
      displayName: 'Python security scan'

- stage: Build
  displayName: 'Build'
  dependsOn: Security
  jobs:
  - job: BuildJob
    steps:
    - script: |
        python manage.py collectstatic --noinput
        python -m compileall .
      displayName: 'Build'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '.'
        includeRootFolder: false
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'

- stage: Test
  displayName: 'Test'
  dependsOn: Build
  jobs:
  - job: UnitTests
    steps:
    - script: |
        pip install pytest pytest-cov pytest-django
        pytest --cov=. --cov-report=xml --junitxml=test-results.xml
      displayName: 'Run tests'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'coverage.xml'

# EXPECTED: Score > 90%, no violations
