# Pipeline sin caché de dependencias
# Escenario: Descarga dependencias en cada ejecución

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    # PROBLEMA: npm install en lugar de npm ci
    - script: npm install
      displayName: 'Install dependencies'

    # PROBLEMA: Sin Cache@2 task para node_modules

    - script: npm run build
      displayName: 'Build'

- stage: Test
  dependsOn: Build
  jobs:
  - job: TestJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    # PROBLEMA: Vuelve a instalar todo sin caché
    - script: npm install
      displayName: 'Install again'

    - script: npm test
      displayName: 'Test'

# EXPECTED VIOLATIONS:
# - MEDIUM: No cache configuration
# - LOW: Using npm install instead of npm ci
# - LOW: Duplicate dependency installation
# EXPECTED SUGGESTIONS:
# - Add Cache@2 task for npm
# - Use npm ci for reproducible builds
# EXPECTED SCORE: 65-75%
