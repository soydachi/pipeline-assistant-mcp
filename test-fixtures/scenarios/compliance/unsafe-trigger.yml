# Pipeline con trigger inseguro
# Escenario: trigger: true permite cualquier push

trigger: true  # PROBLEMA: Ejecuta en cualquier branch/commit

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: npm ci && npm run build
      displayName: 'Build'

- stage: Deploy
  dependsOn: Build
  # PROBLEMA: Sin condición de branch, despliega desde cualquier branch
  jobs:
  - deployment: DeployJob
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Deploying to production"
            displayName: 'Deploy'

# EXPECTED VIOLATIONS:
# - CRITICAL: Unsafe trigger (trigger: true)
# - HIGH: Deploy without branch condition
# - HIGH: Production deploy from any branch
# EXPECTED SCORE: < 40%
