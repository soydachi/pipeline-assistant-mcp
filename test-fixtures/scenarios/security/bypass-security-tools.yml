# Pipeline con bypass de herramientas de seguridad
# Escenario: continueOnError en herramientas críticas

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: npm ci
      displayName: 'Install dependencies'
    - script: npm run build
      displayName: 'Build'

- stage: Security
  dependsOn: Build
  jobs:
  - job: SecurityScan
    steps:
    # PROBLEMA: continueOnError permite bypass
    - task: TruffleHog@1
      displayName: 'Secret Scanning'
      continueOnError: true  # BYPASS: Secretos no bloquean el pipeline

    - task: SonarQubePrepare@5
      displayName: 'SAST Analysis'
      continueOnError: true  # BYPASS: Vulnerabilidades no bloquean

    - task: SnykSecurityScan@1
      displayName: 'Dependency Scan'
      continueOnError: true  # BYPASS: CVEs no bloquean

- stage: Deploy
  dependsOn: Security
  jobs:
  - job: DeployJob
    steps:
    - script: echo "Deploying..."
      displayName: 'Deploy to Production'

# EXPECTED VIOLATIONS:
# - CRITICAL: Security bypass (continueOnError on TruffleHog)
# - CRITICAL: Security bypass (continueOnError on SonarQube)
# - CRITICAL: Security bypass (continueOnError on Snyk)
# EXPECTED SCORE: < 40%
