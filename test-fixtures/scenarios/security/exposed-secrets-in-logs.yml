# Pipeline que expone secretos en logs
# Escenario: echo/print de variables sensibles

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: secure-variables
  - name: API_KEY
    value: '$(API_KEY_SECRET)'  # Bien: referencia a secret
  - name: DB_PASSWORD
    value: '$(DB_PASSWORD_SECRET)'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: |
        echo "Starting build process..."
        echo "API Key: $API_KEY"  # PROBLEMA: Expone secreto en logs
        echo "Database password is: $DB_PASSWORD"  # PROBLEMA: Expone password
        npm ci
        npm run build
      displayName: 'Build with logging'

    - script: |
        # PROBLEMA: Debug logging con secretos
        echo "DEBUG: Connection string = Server=mydb;Password=$DB_PASSWORD"
        npm test
      displayName: 'Test with debug'

    - script: |
        # PROBLEMA: curl con token visible
        curl -v -H "Authorization: Bearer $API_KEY" https://api.example.com/deploy
      displayName: 'Deploy with verbose'

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployJob
    steps:
    - script: |
        # PROBLEMA: Logging de configuración completa
        echo "Deployment config:"
        env | grep -E "(KEY|PASSWORD|SECRET|TOKEN)"  # Expone todas las variables sensibles
      displayName: 'Show config'

# EXPECTED VIOLATIONS:
# - CRITICAL: Secret exposure in logs (multiple instances)
# - HIGH: Verbose curl exposes auth headers
# - HIGH: env grep exposes all secrets
# EXPECTED SCORE: < 35%
