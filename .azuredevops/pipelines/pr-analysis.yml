# Pipeline Assistant - PR Analysis Pipeline
# This pipeline analyzes pull requests for security and compliance issues
# Uses Variable Groups for secure credential management

trigger: none

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - '**/*.yml'
      - '**/*.yaml'

# Link Variable Group from Azure Library
# Only AZDO_PAT is required in the Variable Group
# AZDO_ORG_URL and AZDO_PROJECT are auto-detected from pipeline context
variables:
  - group: pipeline-assistant-config
  # Optional: Override enforcement mode
  # - name: AZDO_ENFORCEMENT_MODE
  #   value: 'enforcement'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Analyze
    displayName: 'Pipeline Analysis'
    jobs:
      - job: AnalyzePipelines
        displayName: 'Analyze Pipeline Files'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          # Clone pipeline-assistant from public GitHub repo
          - script: |
              set -e
              echo "Cloning pipeline-assistant-mcp from GitHub..."
              git clone --depth 1 https://github.com/soydachi/pipeline-assistant-mcp.git $(Agent.TempDirectory)/pipeline-assistant
              cd $(Agent.TempDirectory)/pipeline-assistant
              echo "Installing dependencies..."
              npm ci
              echo "Building..."
              npm run build
              echo "Pipeline Assistant setup complete"
            displayName: 'Setup Pipeline Assistant'

          - script: |
              echo "Analyzing pipeline files in PR..."

              # Find all YAML files changed in the PR
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.yml' '*.yaml' 2>/dev/null || echo "")

              if [ -z "$CHANGED_FILES" ]; then
                echo "No YAML files changed in this PR"
                exit 0
              fi

              # Filter out the pr-analysis pipeline itself and other non-application pipelines
              FILTERED_FILES=""
              for file in $CHANGED_FILES; do
                # Skip pr-analysis.yml and other infrastructure pipelines
                if [[ "$file" == *"pr-analysis.yml"* ]] || [[ "$file" == *"pr-analysis.yaml"* ]]; then
                  echo "Skipping infrastructure pipeline: $file"
                  continue
                fi
                FILTERED_FILES="$FILTERED_FILES $file"
              done
              CHANGED_FILES=$(echo $FILTERED_FILES | xargs)

              if [ -z "$CHANGED_FILES" ]; then
                echo "No application pipeline files to analyze"
                exit 0
              fi

              ANALYSIS_FAILED=0
              HAS_CRITICAL=0
              PA_DIR=$(Agent.TempDirectory)/pipeline-assistant
              TOTAL_SCORE=0
              FILE_COUNT=0

              for file in $CHANGED_FILES; do
                if [ -f "$file" ]; then
                  echo ""
                  echo "=========================================="
                  echo "Analyzing: $file"
                  echo "=========================================="

                  # Use absolute path for the file being analyzed
                  FULL_PATH="$(Build.SourcesDirectory)/$file"

                  # Run analysis and capture output to extract score
                  # Exit codes: 0=pass, 1=high violations, 2=critical violations
                  set +e
                  OUTPUT=$(node $PA_DIR/dist/cli/pipeline-assistant.js analyze -f "$FULL_PATH" 2>&1)
                  EXIT_CODE=$?
                  set -e

                  # Print the output
                  echo "$OUTPUT"

                  # Extract score from output (looks for "Score: XX/100")
                  FILE_SCORE=$(echo "$OUTPUT" | grep -oE 'Score: [0-9]+' | grep -oE '[0-9]+' | head -1)
                  if [ -n "$FILE_SCORE" ]; then
                    TOTAL_SCORE=$((TOTAL_SCORE + FILE_SCORE))
                    FILE_COUNT=$((FILE_COUNT + 1))
                  fi

                  if [ $EXIT_CODE -eq 2 ]; then
                    HAS_CRITICAL=1
                    ANALYSIS_FAILED=1
                  elif [ $EXIT_CODE -ne 0 ]; then
                    ANALYSIS_FAILED=1
                  fi
                fi
              done

              # Calculate average score
              if [ $FILE_COUNT -gt 0 ]; then
                AVG_SCORE=$((TOTAL_SCORE / FILE_COUNT))
              else
                AVG_SCORE=100
              fi

              # Set output variable for use in subsequent jobs
              # These must be set BEFORE any exit to ensure they're available
              echo "##vso[task.setvariable variable=AnalysisScore;isOutput=true]$AVG_SCORE"
              echo "##vso[task.setvariable variable=HasCritical;isOutput=true]$HAS_CRITICAL"
              echo "##vso[task.setvariable variable=AnalysisFailed;isOutput=true]$ANALYSIS_FAILED"
              echo ""
              echo "=========================================="
              echo "Analysis Summary: Average Score = $AVG_SCORE/100"
              echo "=========================================="

              # Log issues but don't fail here - let the EnforcePolicy job handle the exit
              if [ "$AZDO_ENFORCEMENT_MODE" = "enforcement" ] && [ $HAS_CRITICAL -eq 1 ]; then
                echo "##vso[task.logissue type=error]Pipeline analysis found critical issues"
              elif [ "$AZDO_ENFORCEMENT_MODE" = "enforcement" ] && [ $ANALYSIS_FAILED -eq 1 ]; then
                echo "##vso[task.logissue type=warning]Pipeline analysis found high severity issues"
              fi
            name: AnalyzeStep
            displayName: 'Analyze Changed Pipelines'
            env:
              # Use Azure DevOps predefined variables for org/project
              # Only PAT needs to come from Variable Group (secret)
              AZDO_ORG_URL: $(System.CollectionUri)
              AZDO_PAT: $(AZDO_PAT)
              AZDO_PROJECT: $(System.TeamProject)
              AZDO_REPOSITORY: $(Build.Repository.Name)
              AZDO_ENFORCEMENT_MODE: $(AZDO_ENFORCEMENT_MODE)
              AZDO_STRICT_MODE: $(AZDO_STRICT_MODE)
              # Set wiki path to pipeline-assistant's wiki directory
              WIKI_PATH: $(Agent.TempDirectory)/pipeline-assistant/wiki/standards

      - job: PostPRComment
        displayName: 'Post PR Comment'
        dependsOn: AnalyzePipelines
        # Run only when in PR context (System.PullRequest.PullRequestId is set)
        condition: and(always(), ne(variables['System.PullRequest.PullRequestId'], ''))
        variables:
          AnalysisScore: $[ dependencies.AnalyzePipelines.outputs['AnalyzeStep.AnalysisScore'] ]
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          # Clone pipeline-assistant from public GitHub repo
          - script: |
              set -e
              echo "Cloning pipeline-assistant-mcp from GitHub..."
              git clone --depth 1 https://github.com/soydachi/pipeline-assistant-mcp.git $(Agent.TempDirectory)/pipeline-assistant
              cd $(Agent.TempDirectory)/pipeline-assistant
              echo "Installing dependencies..."
              npm ci
              echo "Building..."
              npm run build
              echo "Pipeline Assistant setup complete"
            displayName: 'Setup Pipeline Assistant'

          - script: |
              echo "Posting analysis summary to PR..."

              PA_DIR=$(Agent.TempDirectory)/pipeline-assistant
              PR_ID=$(System.PullRequest.PullRequestId)

              # Use actual score from analysis job
              SCORE=$(AnalysisScore)
              if [ -z "$SCORE" ] || [ "$SCORE" = "" ]; then
                SCORE=100  # Default if no files were analyzed
              fi

              echo "Analysis Score: $SCORE/100"

              # Post comment to Azure DevOps PR
              node $PA_DIR/dist/cli/pr-comment-cli.js azdo \
                --pr-id "$PR_ID" \
                --org-url "$AZDO_ORG_URL" \
                --pat "$AZDO_PAT" \
                --project "$AZDO_PROJECT" \
                --repository "$AZDO_REPOSITORY" \
                --score "$SCORE"

              echo "Comment posted to PR #$PR_ID"
            displayName: 'Post Analysis Comment'
            env:
              AZDO_ORG_URL: $(System.CollectionUri)
              AZDO_PAT: $(AZDO_PAT)
              AZDO_PROJECT: $(System.TeamProject)
              AZDO_REPOSITORY: $(Build.Repository.Name)

      # Final job to enforce policy after comment is posted
      - job: EnforcePolicy
        displayName: 'Enforce Policy'
        dependsOn:
          - AnalyzePipelines
          - PostPRComment
        condition: always()
        variables:
          HasCritical: $[ dependencies.AnalyzePipelines.outputs['AnalyzeStep.HasCritical'] ]
        steps:
          - script: |
              echo "Checking policy enforcement..."
              echo "HasCritical: $(HasCritical)"
              echo "Enforcement Mode: $AZDO_ENFORCEMENT_MODE"

              if [ "$(HasCritical)" = "1" ] && [ "$AZDO_ENFORCEMENT_MODE" = "enforcement" ]; then
                echo "##vso[task.logissue type=error]Pipeline analysis found critical issues - blocking PR"
                exit 1
              fi

              echo "Policy check passed"
            displayName: 'Check Policy Compliance'
            env:
              AZDO_ENFORCEMENT_MODE: $(AZDO_ENFORCEMENT_MODE)
