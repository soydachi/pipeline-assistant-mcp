# GitHub Actions workflow for .NET Application
# Version: 2.0.0 - Follows corporate security and quality standards
# Standards reference: wiki/standards/README.md

name: .NET CI/CD

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.x'
  BUILD_CONFIGURATION: 'Release'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # STAGE 1: VALIDATE
  # ===========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet format --verify-no-changes

  # ===========================================================================
  # STAGE 2: SECURITY
  # ===========================================================================
  secret-scan:
    name: 'SEC-001: Secret Scan'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --fail

  sast:
    name: 'SEC-002: SAST'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }}
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

  dependency-scan:
    name: 'SEC-003: Dependency Scan'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet list package --vulnerable --include-transitive
      - uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  license-compliance:
    name: 'SEC-008: License Compliance'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: License Check
        run: |
          dotnet tool install --global dotnet-project-licenses
          dotnet-project-licenses -i . -o licenses.json --export-license-texts
          dotnet-project-licenses -i . --fail-on-forbidden --forbidden GPL-2.0-only GPL-3.0-only AGPL-3.0-only
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: licenses.json
        if: always()

  # ===========================================================================
  # STAGE 3: BUILD
  # ===========================================================================
  build:
    name: Build
    needs: [secret-scan, sast, dependency-scan, license-compliance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      - run: dotnet publish --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

      # SEC-010: Generate SBOM
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            ./publish/
            sbom.*.json

  # ===========================================================================
  # STAGE 4: TEST
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - name: Run Tests
        run: |
          dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} \
            --collect:"XPlat Code Coverage" \
            --logger trx \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - uses: codecov/codecov-action@v4
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: YourStrong@Passw0rd
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet test --filter "Category=Integration" --logger trx
        env:
          CONNECTION_STRING: "Server=localhost;Database=test;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true"

  # ===========================================================================
  # STAGE 5: SCAN (Container) - Optional
  # ===========================================================================
  docker:
    name: Build & Scan Container
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          load: true

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ===========================================================================
  # STAGE 6: DEPLOY
  # ===========================================================================
  deploy-dev:
    name: Deploy to Development
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}-dev
          package: ./app/publish
      - run: |
          sleep 30
          curl -f https://${{ vars.WEBAPP_NAME }}-dev.azurewebsites.net/health || exit 1

  deploy-staging:
    name: Deploy to Staging
    needs: [unit-tests, integration-tests]
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}-staging
          package: ./app/publish
      - run: |
          sleep 30
          curl -f https://${{ vars.WEBAPP_NAME }}-staging.azurewebsites.net/health || exit 1

      # SEC-007: DAST
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://${{ vars.WEBAPP_NAME }}-staging.azurewebsites.net'
          cmd_options: '-I'

  deploy-prod:
    name: Deploy to Production
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}-prod
          package: ./app/publish
      - run: |
          sleep 30
          curl -f https://${{ vars.WEBAPP_NAME }}-prod.azurewebsites.net/health || exit 1
