trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '20.x'
  - name: dockerRegistry
    value: 'myacr.azurecr.io'
  - name: imageRepository
    value: 'myapp-node'
  - group: common-variables
  - group: database-secrets

stages:
- stage: Validate
  displayName: 'Code Validation'
  jobs:
  - job: Lint
    displayName: 'Linting & Format Check'
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npm run lint
      displayName: 'Run ESLint'

    - script: npm run format:check
      displayName: 'Check Formatting'

- stage: Security
  displayName: 'Security Scanning'
  dependsOn: Validate
  jobs:
  - job: SecretScan
    displayName: 'Secret Detection'
    steps:
    - script: |
        docker run --rm -v "$(Build.SourcesDirectory):/src" \
          trufflesecurity/trufflehog:latest \
          filesystem /src \
          --fail \
          --no-update
      displayName: 'TruffleHog Secret Scan'

  - job: DependencyScan
    displayName: 'Dependency Scanning'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npm audit --audit-level=high
      displayName: 'NPM Audit'

    - task: SnykSecurityScan@1
      displayName: 'Snyk Security Scan'
      inputs:
        serviceConnectionEndpoint: 'Snyk-Connection'
        testType: 'app'
        severityThreshold: 'high'
        failOnIssues: true

- stage: Build
  displayName: 'Build Application'
  dependsOn: Security
  jobs:
  - job: BuildNode
    displayName: 'Build Node.js Application'
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: $(nodeVersion)

    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        path: $(npm_config_cache)
        restoreKeys: |
          npm | "$(Agent.OS)"

    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npm run build
      displayName: 'Build Application'

    - task: ArchiveFiles@2
      displayName: 'Archive Build Output'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: 'drop'
      displayName: 'Publish Artifact'

- stage: BuildDocker
  displayName: 'Build & Push Docker Image'
  dependsOn: Build
  jobs:
  - job: Docker
    displayName: 'Docker Build & Push'
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        repository: $(imageRepository)
        dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - script: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --exit-code 1 \
          --severity CRITICAL,HIGH \
          $(imageRepository):$(Build.BuildId)
      displayName: 'Trivy Container Scan'

    - task: Docker@2
      displayName: 'Push to Registry'
      inputs:
        command: 'push'
        repository: $(imageRepository)
        containerRegistry: 'ACR-ServiceConnection'
        tags: |
          $(Build.BuildId)
          latest

- stage: Test
  displayName: 'Testing'
  dependsOn: Build
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npm test -- --coverage
      displayName: 'Run Unit Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/junit.xml'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'

  - job: IntegrationTests
    displayName: 'Integration Tests'
    dependsOn: UnitTests
    steps:
    - script: |
        docker-compose -f docker-compose.test.yml up -d
      displayName: 'Start Test Dependencies'

    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npm run test:integration
      displayName: 'Run Integration Tests'

    - script: |
        docker-compose -f docker-compose.test.yml down
      displayName: 'Stop Test Dependencies'
      condition: always()

- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn:
    - Test
    - BuildDocker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Dev Environment'
    environment: 'development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-node-dev'
              containers: '$(dockerRegistry)/$(imageRepository):$(Build.BuildId)'

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn:
    - Test
    - BuildDocker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployToProd
    displayName: 'Deploy to Production Environment'
    environment: 'production'
    strategy:
      runOnce:
        preDeploy:
          steps:
          - task: ManualValidation@0
            displayName: 'Approval Required'
            inputs:
              notifyUsers: 'devops-team@company.com'

        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-node-prod'
              containers: '$(dockerRegistry)/$(imageRepository):$(Build.BuildId)'

        postRouteTraffic:
          steps:
          - script: |
              curl -f https://myapp-node-prod.azurewebsites.net/health || exit 1
            displayName: 'Health Check'
