trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'
  dockerRegistry: 'myacr.azurecr.io'
  imageRepository: 'myapp-python'
  - group: common-variables
  - group: database-secrets

stages:
- stage: Validate
  displayName: 'Code Validation'
  jobs:
  - job: Lint
    displayName: 'Linting & Format Check'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy
      displayName: 'Install Linting Tools'

    - script: black --check .
      displayName: 'Check Code Formatting (Black)'

    - script: flake8 .
      displayName: 'Run Flake8'

    - script: mypy .
      displayName: 'Type Checking (MyPy)'

- stage: Security
  displayName: 'Security Scanning'
  dependsOn: Validate
  jobs:
  - job: SecretScan
    displayName: 'Secret Detection'
    steps:
    - task: TruffleHog@1
      displayName: 'Scan for Secrets'
      inputs:
        failOnHighSeverity: true

  - job: DependencyScan
    displayName: 'Dependency Scanning'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        pip install safety bandit
      displayName: 'Install Security Tools'

    - script: safety check
      displayName: 'Safety Check (Dependencies)'

    - script: bandit -r . -f json -o bandit-report.json
      displayName: 'Bandit SAST Scan'

- stage: Build
  displayName: 'Build Application'
  dependsOn: Security
  jobs:
  - job: BuildPython
    displayName: 'Build Python Application'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: $(pythonVersion)

    - task: Cache@2
      displayName: 'Cache pip packages'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        path: $(PIP_CACHE_DIR)
        restoreKeys: |
          pip | "$(Agent.OS)"

    - script: |
        python -m pip install --upgrade pip
        pip install poetry
      displayName: 'Install Poetry'

    - script: poetry install
      displayName: 'Install Dependencies'

    - script: poetry build
      displayName: 'Build Package'

    - publish: '$(System.DefaultWorkingDirectory)/dist'
      artifact: 'drop'
      displayName: 'Publish Artifact'

- stage: BuildDocker
  displayName: 'Build & Push Docker Image'
  dependsOn: Build
  jobs:
  - job: Docker
    displayName: 'Docker Build & Push'
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        repository: $(imageRepository)
        dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - task: Trivy@1
      displayName: 'Scan Docker Image'
      inputs:
        image: '$(imageRepository):$(Build.BuildId)'
        exitCode: 1
        severity: 'CRITICAL,HIGH'

    - task: Docker@2
      displayName: 'Push to Registry'
      inputs:
        command: 'push'
        repository: $(imageRepository)
        containerRegistry: 'ACR-ServiceConnection'
        tags: |
          $(Build.BuildId)
          latest

- stage: Test
  displayName: 'Testing'
  dependsOn: Build
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        pip install poetry
        poetry install
      displayName: 'Install Dependencies'

    - script: poetry run pytest tests/ --cov=./ --cov-report=xml --cov-report=html --junitxml=junit.xml
      displayName: 'Run Tests with Coverage'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/junit.xml'

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'

- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn:
    - Test
    - BuildDocker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Dev Environment'
    environment: 'development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-python-dev'
              containers: '$(dockerRegistry)/$(imageRepository):$(Build.BuildId)'

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn:
    - Test
    - BuildDocker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployToProd
    displayName: 'Deploy to Production Environment'
    environment: 'production'
    strategy:
      runOnce:
        preDeploy:
          steps:
          - task: ManualValidation@0
            displayName: 'Approval Required'
            inputs:
              notifyUsers: 'devops-team@company.com'

        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-python-prod'
              containers: '$(dockerRegistry)/$(imageRepository):$(Build.BuildId)'
