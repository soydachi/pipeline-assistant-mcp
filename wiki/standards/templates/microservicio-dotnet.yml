trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'
  dockerRegistry: 'myacr.azurecr.io'
  imageRepository: 'myapp'
  - group: common-variables
  - group: database-secrets

stages:
- stage: Validate
  displayName: 'Code Validation'
  jobs:
  - job: Lint
    displayName: 'Linting & Format Check'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        version: $(dotnetVersion)

    - script: |
        dotnet format --verify-no-changes
      displayName: 'Check Code Formatting'

- stage: Security
  displayName: 'Security Scanning'
  dependsOn: Validate
  jobs:
  - job: SecretScan
    displayName: 'Secret Detection'
    steps:
    - task: TruffleHog@1
      displayName: 'Scan for Secrets'
      inputs:
        failOnHighSeverity: true

  - job: SAST
    displayName: 'Static Analysis'
    steps:
    - task: SonarQubePrepare@5
      displayName: 'Prepare SonarQube'
      inputs:
        SonarQube: 'SonarQube-Connection'
        scannerMode: 'MSBuild'
        projectKey: 'my-project'

    - task: DotNetCoreCLI@2
      displayName: 'Build for Analysis'
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration)'

    - task: SonarQubeAnalyze@5
      displayName: 'Run SonarQube Analysis'

    - task: SonarQubePublish@5
      displayName: 'Publish Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

  - job: DependencyScan
    displayName: 'Dependency Scanning'
    steps:
    - task: WhiteSource@21
      displayName: 'WhiteSource Scan'
      inputs:
        cwd: '$(System.DefaultWorkingDirectory)'

- stage: Build
  displayName: 'Build Application'
  dependsOn: Security
  jobs:
  - job: BuildDotNet
    displayName: 'Build .NET Application'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        version: $(dotnetVersion)

    - task: Cache@2
      displayName: 'Cache NuGet packages'
      inputs:
        key: 'nuget | "$(Agent.OS)" | **/packages.lock.json'
        path: '$(NUGET_PACKAGES)'
        restoreKeys: |
          nuget | "$(Agent.OS)"

    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: 'drop'
      displayName: 'Publish Artifact'

- stage: BuildDocker
  displayName: 'Build & Push Docker Image'
  dependsOn: Build
  jobs:
  - job: Docker
    displayName: 'Docker Build & Push'
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: 'build'
        repository: $(imageRepository)
        dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - task: Trivy@1
      displayName: 'Scan Docker Image'
      inputs:
        image: '$(imageRepository):$(Build.BuildId)'
        exitCode: 1
        severity: 'CRITICAL,HIGH'

    - task: Docker@2
      displayName: 'Push to Registry'
      inputs:
        command: 'push'
        repository: $(imageRepository)
        containerRegistry: 'ACR-ServiceConnection'
        tags: |
          $(Build.BuildId)
          latest

- stage: Test
  displayName: 'Testing'
  dependsOn: Build
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    steps:
    - task: UseDotNet@2
      inputs:
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: 'Run Unit Tests'
      inputs:
        command: 'test'
        projects: '**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage" --logger trx'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

  - job: IntegrationTests
    displayName: 'Integration Tests'
    dependsOn: UnitTests
    steps:
    - script: |
        docker-compose -f docker-compose.test.yml up -d
      displayName: 'Start Test Dependencies'

    - task: DotNetCoreCLI@2
      displayName: 'Run Integration Tests'
      inputs:
        command: 'test'
        projects: '**/*IntegrationTests.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - script: |
        docker-compose -f docker-compose.test.yml down
      displayName: 'Stop Test Dependencies'
      condition: always()

- stage: DeployDev
  displayName: 'Deploy to Development'
  dependsOn:
    - Test
    - BuildDocker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Dev Environment'
    environment: 'development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-dev'
              containers: '$(dockerRegistry)/$(imageRepository):$(Build.BuildId)'

          - task: AzureAppServiceSettings@1
            displayName: 'Configure App Settings'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-dev'
              resourceGroupName: 'rg-myapp-dev'
              appSettings: |
                [
                  {
                    "name": "ASPNETCORE_ENVIRONMENT",
                    "value": "Development",
                    "slotSetting": false
                  }
                ]

- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn:
    - Test
    - BuildDocker
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployToProd
    displayName: 'Deploy to Production Environment'
    environment: 'production'
    strategy:
      runOnce:
        preDeploy:
          steps:
          - task: ManualValidation@0
            displayName: 'Approval Required'
            inputs:
              notifyUsers: 'devops-team@company.com'
              instructions: 'Please verify the release notes and approve the production deployment'

        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-prod'
              containers: '$(dockerRegistry)/$(imageRepository):$(Build.BuildId)'

          - task: AzureAppServiceSettings@1
            displayName: 'Configure App Settings'
            inputs:
              azureSubscription: 'Azure-ServiceConnection'
              appName: 'myapp-prod'
              resourceGroupName: 'rg-myapp-prod'
              appSettings: |
                [
                  {
                    "name": "ASPNETCORE_ENVIRONMENT",
                    "value": "Production",
                    "slotSetting": false
                  }
                ]

        postRouteTraffic:
          steps:
          - script: |
              curl -f https://myapp-prod.azurewebsites.net/health || exit 1
            displayName: 'Health Check'
            retryCountOnTaskFailure: 3
