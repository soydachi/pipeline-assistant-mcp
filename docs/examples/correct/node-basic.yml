# Pipeline CI/CD Autogenerado
# Generado por: Pipeline Assistant MCP
# Plataforma: Azure Pipelines
# Fecha: 2025-11-18T17:43:43.401Z
# Tipo de proyecto: node
# Ambiente: dev
# Basado en: wiki/standards/pipeline-standards.md

trigger:
  branches:
    include:
      - feature/*
      - develop
  paths:
    exclude:
      - '*.md'
      - docs/*
      - .github/*
pr:
  - main
  - develop
pool:
  vmImage: ubuntu-latest
variables:
  - group: dev-variables
  - name: buildConfiguration
    value: Debug
  - name: nodeVersion
    value: 20.x
stages:
  - stage: Validate
    displayName: Code Validation
    jobs:
      - job: Lint
        displayName: Linting & Format Check
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 20.x
          - script: npm ci
            displayName: Install Dependencies
          - script: npm run lint
            displayName: Run ESLint
  - stage: Security
    displayName: Security Scanning
    dependsOn:
      - Validate
    jobs:
      - job: SecretScan
        displayName: Secret Detection
        steps:
          - script: |-
              docker run --rm -v "$(Build.SourcesDirectory):/src" \
                trufflesecurity/trufflehog:latest \
                filesystem /src \
                --fail \
                --no-update
            displayName: TruffleHog Secret Scan
            continueOnError: false
      - job: SAST
        displayName: Static Analysis
        steps:
          - task: SonarQubePrepare@6
            displayName: Prepare SonarQube Analysis
            inputs:
              SonarQube: SonarQube-Connection
              scannerMode: CLI
              configMode: manual
              cliProjectKey: $(Build.Repository.Name)
              cliSources: .
              extraProperties: |-
                sonar.javascript.lcov.reportPaths=coverage/lcov.info
                sonar.typescript.lcov.reportPaths=coverage/lcov.info
          - task: SonarQubeAnalyze@6
            displayName: Run SonarQube Analysis
          - task: SonarQubePublish@6
            displayName: Publish SonarQube Results
            inputs:
              pollingTimeoutSec: '300'
      - job: DependencyScan
        displayName: Dependency Scanning
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 20.x
          - script: npm ci
            displayName: Install Dependencies
          - script: npm audit --audit-level=high
            displayName: NPM Security Audit
          - task: SnykSecurityScan@1
            displayName: Snyk Security Scan
            inputs:
              serviceConnectionEndpoint: Snyk-Connection
              testType: app
              severityThreshold: high
              failOnIssues: true
  - stage: Build
    displayName: Build Application
    dependsOn:
      - Security
    jobs:
      - job: BuildApp
        displayName: Build node Application
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 20.x
          - script: npm ci
            displayName: Install Dependencies
          - script: npm run build
            displayName: Build Application
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact: drop'
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop
              publishLocation: Container
  - stage: Test
    displayName: Testing
    dependsOn:
      - Build
    jobs:
      - job: UnitTests
        displayName: Unit Tests
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: 20.x
          - script: npm ci
            displayName: Install Dependencies
          - script: npm test -- --coverage
            displayName: Run Tests
          - task: PublishTestResults@2
            displayName: Publish Test Results
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/junit.xml'
              failTaskOnFailedTests: true
          - task: PublishCodeCoverageResults@2
            displayName: Publish Code Coverage
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml
  - stage: DeployDev
    displayName: Deploy to Dev
    dependsOn:
      - Test
    jobs:
      - job: Deploy
        displayName: Deploy to dev Environment
        steps:
          - script: echo "Deploying to dev..."
            displayName: Deploy Application
