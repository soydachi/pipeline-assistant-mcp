# Pipeline CI/CD Autogenerado
# Generado por: Pipeline Assistant MCP
# Plataforma: Azure Pipelines
# Fecha: 2025-11-18T17:43:43.237Z
# Tipo de proyecto: dotnet
# Ambiente: prod
# Basado en: wiki/standards/pipeline-standards.md

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - docs/*
      - .github/*
pr:
  - main
  - develop
pool:
  vmImage: ubuntu-latest
variables:
  - group: prod-variables
  - name: buildConfiguration
    value: Release
  - name: dotnetVersion
    value: 8.x
  - name: REDIS_HOST
    value: $(prod-redis-host)
  - name: REDIS_PORT
    value: '6380'
  - name: REDIS_SSL
    value: 'true'
  - name: SQL_SERVER
    value: $(prod-sql-server)
  - name: SQL_DATABASE
    value: $(prod-sql-database)
  - name: keyVaultName
    value: kv-prod-001
stages:
  - stage: Validate
    displayName: Code Validation
    jobs:
      - job: Lint
        displayName: Linting & Format Check
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet restore
            displayName: Restore Dependencies
          - script: dotnet format --verify-no-changes
            displayName: Check Formatting
  - stage: Security
    displayName: Security Scanning
    dependsOn:
      - Validate
    jobs:
      - job: SecretScan
        displayName: Secret Detection
        steps:
          - script: |-
              docker run --rm -v "$(Build.SourcesDirectory):/src" \
                trufflesecurity/trufflehog:latest \
                filesystem /src \
                --fail \
                --no-update
            displayName: TruffleHog Secret Scan
            continueOnError: false
      - job: SAST
        displayName: Static Analysis
        steps:
          - task: SonarQubePrepare@6
            displayName: Prepare SonarQube Analysis
            inputs:
              SonarQube: SonarQube-Connection
              scannerMode: CLI
              configMode: manual
              cliProjectKey: $(Build.Repository.Name)
              cliSources: .
              extraProperties: |-
                sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/**/coverage.opencover.xml
                sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/**/*.trx
          - task: SonarQubeAnalyze@6
            displayName: Run SonarQube Analysis
          - task: SonarQubePublish@6
            displayName: Publish SonarQube Results
            inputs:
              pollingTimeoutSec: '300'
      - job: DependencyScan
        displayName: Dependency Scanning
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet list package --vulnerable --include-transitive
            displayName: .NET Vulnerability Check
          - task: SnykSecurityScan@1
            displayName: Snyk Security Scan
            inputs:
              serviceConnectionEndpoint: Snyk-Connection
              testType: app
              severityThreshold: high
              failOnIssues: true
  - stage: Build
    displayName: Build Application
    dependsOn:
      - Security
    jobs:
      - job: BuildApp
        displayName: Build dotnet Application
        steps:
          - task: AzureKeyVault@2
            displayName: Fetch secrets from Key Vault
            inputs:
              azureSubscription: Azure-ServiceConnection
              KeyVaultName: kv-prod-001
              SecretsFilter: '*'
              RunAsPreJob: 'true'
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet build --configuration $(buildConfiguration)
            displayName: Build Application
          - script: dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
            displayName: Publish Application
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact: drop'
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop
              publishLocation: Container
  - stage: Test
    displayName: Testing
    dependsOn:
      - Build
    jobs:
      - job: UnitTests
        displayName: Unit Tests
        services:
          redis:
            image: redis:7-alpine
            ports:
              - '6379:6379'
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet test --configuration $(buildConfiguration) --collect:"XPlat Code Coverage" --logger trx
            displayName: Run Tests
          - task: PublishTestResults@2
            displayName: Publish Test Results
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              failTaskOnFailedTests: true
          - task: PublishCodeCoverageResults@2
            displayName: Publish Code Coverage
            inputs:
              summaryFileLocation: '**/coverage.cobertura.xml'
  - stage: DeployProd
    displayName: Deploy to Prod
    dependsOn:
      - Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: Deploy to prod Environment
        steps:
          - script: |-
              echo "Checking Redis connectivity..."
              redis-cli -h $(REDIS_HOST) -p $(REDIS_PORT) --tls ping || echo "Redis check skipped (CLI not available)"
              echo "Checking Azure SQL connectivity..."
              sqlcmd -S $(SQL_SERVER) -d $(SQL_DATABASE) -Q "SELECT 1" || echo "SQL check skipped (sqlcmd not available)"
            displayName: Service Health Checks
            continueOnError: true
          - script: echo "Deploying to prod..."
            displayName: Deploy Application
          - script: echo "Running smoke tests..."
            displayName: Smoke Tests
