# Generado por: Pipeline Assistant MCP
# Plataforma: Azure Pipelines
# Fecha: 2025-11-18T17:43:43.072Z
# Tipo de proyecto: dotnet
# Ambiente: dev
# Basado en: wiki/standards/pipeline-standards.md

trigger:
  branches:
    include:
      - feature/*
      - develop
  paths:
    exclude:
      - '*.md'
      - docs/*
      - .github/*
pr:
  - main
  - develop
pool:
  vmImage: ubuntu-latest
variables:
  - group: dev-variables
  - name: buildConfiguration
    value: Debug
  - name: dotnetVersion
    value: 8.x
stages:
  - stage: Validate
    displayName: Code Validation
    jobs:
      - job: Lint
        displayName: Linting & Format Check
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet restore
            displayName: Restore Dependencies
          - script: dotnet format --verify-no-changes
            displayName: Check Formatting
  - stage: Security
    displayName: Security Scanning
    dependsOn:
      - Validate
    jobs:
      - job: SecretScan
        displayName: Secret Detection
        steps:
          - script: |-
              docker run --rm -v "$(Build.SourcesDirectory):/src" \
                trufflesecurity/trufflehog:latest \
                filesystem /src \
                --fail \
                --no-update
            displayName: TruffleHog Secret Scan
            continueOnError: false
      - job: SAST
        displayName: Static Analysis
        steps:
          - task: SonarQubePrepare@6
            displayName: Prepare SonarQube Analysis
            inputs:
              SonarQube: SonarQube-Connection
              scannerMode: CLI
              configMode: manual
              cliProjectKey: $(Build.Repository.Name)
              cliSources: .
              extraProperties: |-
                sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/**/coverage.opencover.xml
                sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/**/*.trx
          - task: SonarQubeAnalyze@6
            displayName: Run SonarQube Analysis
          - task: SonarQubePublish@6
            displayName: Publish SonarQube Results
            inputs:
              pollingTimeoutSec: '300'
      - job: DependencyScan
        displayName: Dependency Scanning
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet list package --vulnerable --include-transitive
            displayName: .NET Vulnerability Check
          - task: SnykSecurityScan@1
            displayName: Snyk Security Scan
            inputs:
              serviceConnectionEndpoint: Snyk-Connection
              testType: app
              severityThreshold: high
              failOnIssues: true
  - stage: Build
    displayName: Build Application
    dependsOn:
      - Security
    jobs:
      - job: BuildApp
        displayName: Build dotnet Application
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet build --configuration $(buildConfiguration)
            displayName: Build Application
          - script: dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
            displayName: Publish Application
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact: drop'
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop
              publishLocation: Container
  - stage: Test
    displayName: Testing
    dependsOn:
      - Build
    jobs:
      - job: UnitTests
        displayName: Unit Tests
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 8.x
          - script: dotnet test --configuration $(buildConfiguration) --collect:"XPlat Code Coverage" --logger trx
            displayName: Run Tests
          - task: PublishTestResults@2
            displayName: Publish Test Results
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              failTaskOnFailedTests: true
          - task: PublishCodeCoverageResults@2
            displayName: Publish Code Coverage
            inputs:
              summaryFileLocation: '**/coverage.cobertura.xml'
  - stage: DeployDev
    displayName: Deploy to Dev
    dependsOn:
      - Test
    jobs:
      - job: Deploy
        displayName: Deploy to dev Environment
        steps:
          - script: echo "Deploying to dev..."
            displayName: Deploy Application
