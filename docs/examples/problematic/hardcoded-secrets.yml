# Pipeline con Secretos Hardcodeados
# Este pipeline viola SEC-001: Secret Scanning
# Score esperado: ~30/100

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

# PROBLEMA: Secretos hardcodeados en variables
variables:
  DB_PASSWORD: 'SuperSecret123!'
  API_KEY: 'sk-1234567890abcdef'
  CONNECTION_STRING: 'Server=myserver.database.windows.net;Database=mydb;User Id=admin;Password=P@ssw0rd!'
  AWS_SECRET_KEY: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'

stages:
  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: BuildJob
        displayName: 'Build'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - script: dotnet restore
            displayName: 'Restore Dependencies'

          - script: dotnet build --configuration Release
            displayName: 'Build Application'

          # PROBLEMA: Usando secretos directamente en scripts
          - script: |
              echo "Connecting to database..."
              sqlcmd -S myserver.database.windows.net -U admin -P 'P@ssw0rd!' -d mydb -Q "SELECT 1"
            displayName: 'Test Database Connection'

  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn: Build
    jobs:
      - job: DeployJob
        displayName: 'Deploy'
        steps:
          # PROBLEMA: Deploy directo sin approval gates
          - script: |
              echo "Deploying with API key: $(API_KEY)"
              curl -H "Authorization: Bearer $(API_KEY)" https://api.example.com/deploy
            displayName: 'Deploy Application'
