# Pipeline sin Stage de Seguridad
# Este pipeline viola POL-001: Missing Security Stage
# Score esperado: ~40/100

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: production-variables
  - name: buildConfiguration
    value: 'Release'

stages:
  # PROBLEMA: No hay stage de seguridad
  # Falta: TruffleHog, SonarQube, Snyk, etc.

  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: BuildJob
        displayName: 'Build'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          - script: npm install
            displayName: 'Install Dependencies'
            # PROBLEMA: npm install en lugar de npm ci

          - script: npm run build
            displayName: 'Build Application'

  - stage: Test
    displayName: 'Run Tests'
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: 'Unit Tests'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'

          - script: npm install
            displayName: 'Install Dependencies'

          - script: npm test
            displayName: 'Run Tests'
            # PROBLEMA: Sin coverage reporting

  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn: Test
    jobs:
      - job: DeployJob
        displayName: 'Deploy'
        steps:
          - script: echo "Deploying..."
            displayName: 'Deploy Application'
            # PROBLEMA: Sin approval gates para produccion
